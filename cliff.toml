# git-cliff: the next version and the release notes, from Conventional Commits since the last tag.
# Preview the next release with `pnpm exec git-cliff --unreleased --bump`.

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope and commit.scope != "deps" %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
# Breaking changes always appear, whatever their type.
protect_breaking_commits = true
# The comments order the groups, and are stripped from the headings.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix\\(deps\\)", group = "<!-- 4 -->Dependencies" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = ".*", skip = true },
]

[bump]
# Before 1.0, a breaking change bumps the minor version, not the major.
breaking_always_bump_major = false
features_always_bump_minor = true
initial_tag = "v0.1.0"
