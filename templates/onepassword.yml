# A 1Password account, individual or family. On a device that's signed in,
# the account password unlocks it. A new device takes the password and the
# Secret Key, which is kept on signed-in devices and in the Emergency Kit,
# and the second factor if two-factor authentication is on.
#
# Nobody can reset the password. A recovery code, with the account's email,
# sets a new password and Secret Key, and two-factor authentication stays on.
# In a family account an organizer can recover you instead, which resets it;
# the link comes to your email. Without either, the account is gone. Biometric
# unlock isn't covered: it's a convenience that expires, not a way back.
template:
  name: 1Password
  note: A 1Password account (individual or family), its Secret Key and how it's recovered.
  checked: 2026-11-23
  links:
    About your Secret Key: https://support.1password.com/secret-key-security/
    If you forgot your 1Password account password: https://support.1password.com/forgot-account-password/
    Generate and use recovery codes: https://support.1password.com/recovery-codes/
    Turn on two-factor authentication: https://support.1password.com/two-factor-authentication/
  prefix: onepassword
  stands_in:
    onepassword: Is 1Password your password manager?
  slots:
    pm_master: Your 1Password account password
    laptop: A computer signed in to 1Password
    phone: A phone signed in to 1Password
    authenticator: Your authenticator app
    hw_key: Your security key
    safe: Where the Emergency Kit and recovery code are kept
    mail: The email account on your 1Password account
    partner: Your family organizer (often your partner)
  optional:
    onepassword_laptop: true
    onepassword_phone: true
    onepassword_kit: true
    onepassword_totp: false
    onepassword_key: false
    onepassword_rc: false
    onepassword_family: false

things:
  pm_master: {kind: secret}
  laptop: {kind: device}
  phone: {kind: device}
  authenticator: {kind: data}
  hw_key: {kind: device}
  safe: {kind: location}
  mail: {kind: account}
  partner: {kind: location}

  onepassword_laptop: {kind: secret, in: laptop, note: '1Password on a computer, signed in'}
  onepassword_phone: {kind: secret, in: phone, note: '1Password on a phone, signed in'}
  onepassword_kit: {kind: secret, in: safe, note: 'the Emergency Kit, with your Secret Key'}
  onepassword_sk:
    kind: secret
    note: the Secret Key
    in: [onepassword_laptop, onepassword_phone, onepassword_kit]
  onepassword_totp: {kind: secret, in: authenticator, note: 'two-factor authentication: an authenticator app'}
  onepassword_key: {kind: secret, in: hw_key, note: 'two-factor authentication: a security key'}
  onepassword_rc: {kind: secret, in: safe, note: 'a recovery code, which sets a new password'}
  onepassword_family: {kind: secret, in: partner, note: 'a family organizer, who can recover your account'}

  onepassword:
    kind: service
    note: 1Password, unlocked
    check: breach
    # Signed in already, the password; on a new device, the Secret Key and any second factor too.
    access: >-
      ((onepassword_laptop or onepassword_phone) and pm_master)
      or (pm_master and onepassword_sk and (onepassword_totp or onepassword_key))
    recovery: >-
      (onepassword_rc and mail and (onepassword_totp or onepassword_key))
      or (onepassword_family and mail)
