# Generic: online banking at a bank or credit union (Chase, Bank of America,
# Wells Fargo, Citi, Capital One, a credit union). Banks differ in the
# details, so check yours against what's here.
#
# Signing in takes the password and, on a device the bank doesn't know, a
# second step: a code by text, call or email, an approval in the bank's app,
# and at some banks an authenticator app or a security key. If yours still
# offers a text once you've chosen something stronger, keep texts ticked. A
# computer the bank remembers skips the second step, and the app, once
# signed in, opens with the phone's unlock.
#
# A forgotten password is reset online with your personal details (SSN, date
# of birth, an account or card number) and a code to the number or email on
# file. Data breaches have leaked those details for most people, so they're
# kept in your head and, as far as you know, perhaps by someone else: a
# breach that relies on them is UNSURE. A branch resets it with photo ID.
# Phone support may too, on whatever it asks; add that as `unknown` if
# yours does.
template:
  name: Bank
  note: Online banking at a bank or credit union (Chase, Bank of America, Wells Fargo, Citi, Capital One), its second step and how a password is reset.
  checked: 2026-11-24
  prefix: bank
  slots:
    vault: Where the password is kept
    phone_number: The phone number the bank has on file
    mail: The email account the bank has on file
    phone: The phone with the bank's app
    laptop: A computer the bank remembers
    authenticator: Your authenticator app
    hw_key: Your security key
    head: What you remember
    id_card: Your photo ID
    body: Turning up in person
  optional:
    bank_sms: true
    bank_mail_code: false
    bank_app: true
    bank_laptop: true
    bank_totp: false
    bank_key: false
    bank_reset: true
    bank_branch: true

things:
  vault: {kind: service, note: 'your password manager, unlocked'}
  phone_number: {kind: service}
  mail: {kind: account}
  phone: {kind: device}
  laptop: {kind: device}
  authenticator: {kind: data}
  hw_key: {kind: device}
  head: {kind: location}
  id_card: {kind: device}
  body: {kind: location}

  bank_pw: {kind: secret, in: vault}
  bank_identity: {kind: secret, in: [head, unknown], note: 'your SSN, date of birth and address, which data breaches may have leaked'}
  bank_sms: {kind: secret, in: phone_number, note: 'codes by text or call'}
  bank_mail_code: {kind: secret, in: mail, note: 'codes by email'}
  bank_app: {kind: secret, in: phone, note: "the bank's app, signed in, which opens with the phone's unlock"}
  bank_laptop: {kind: secret, in: laptop, note: 'a computer the bank remembers, which skips the second step'}
  bank_totp: {kind: secret, in: authenticator, note: an authenticator app}
  bank_key: {kind: secret, in: hw_key, note: a security key}
  bank_reset:
    kind: secret
    note: 'a reset online, with your personal details and a code to your number or email'
    access: bank_identity and (phone_number or mail)
  bank_branch:
    kind: secret
    note: 'a reset at a branch, with photo ID (not at online-only banks)'
    access: id_card and body

  bank:
    kind: account
    check: [lockout, breach]
    access: (bank_pw and (bank_sms or bank_mail_code or bank_laptop or bank_totp or bank_key)) or bank_app
    recovery: bank_reset or bank_branch
