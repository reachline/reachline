# ReachLine behind a TLS reverse proxy on the same host. See the README for
# the settings, and .env.template for what each one does.
#
#   docker compose up -d
#   docker compose exec reachline reset-password <username>

services:
  reachline:
    build: .
    restart: unless-stopped
    ports:
      - 5199:5199
    environment:
      AUTH_REGISTRATION: "1"
      # Single sign-on; see the README.
      # AUTH_METHODS: password,oidc
      # AUTH_OIDC_ISSUER: https://auth.example.com/application/o/reachline/
      # AUTH_OIDC_CLIENT_ID: ...
      # AUTH_OIDC_CLIENT_SECRET: ...
    volumes:
      - reachline-data:/data

volumes:
  reachline-data:
