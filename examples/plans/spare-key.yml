# Plan: a second FIDO2 key kept off-site, and no more mail resets by SMS.
#
#   ./reach.ts --model examples/model.yml --plan plans/spare-key.yml
#
# Fields listed here replace the model's (whole fields); a new id adds a thing.

locations:
  offsite: {note: a friend's house across town}

devices:
  key_keyring: {in: [carried]}
  key_offsite: {in: [offsite]}
  hw_key:
    in: []
    access: [[[key_keyring, key_offsite]]]
    note: any one of my keys; every account enrolls both

accounts:
  mail:
    recovery: [[mail_codes]]

scenarios:
  keys_lost:
    kind: lockout
    lost: [key_keyring]
    note: keyring gone

me: [head, body, carried, home, contacts, offsite]
