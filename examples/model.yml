version: 1

things:
  head: {kind: location, note: memorized}
  body: {kind: location, note: biometrics}
  carried: {kind: location, note: on my person when out}
  home: {kind: location}
  safe: {kind: location, in: home, lock: safe_combo, note: fire-rated box in the hall closet}
  partner: {kind: location, note: what my partner knows and has}

  laptop: {kind: device, in: home, lock: laptop_pw or finger or laptop_open}
  phone: {kind: device, in: carried, lock: phone_pin or face}
  sim:
    kind: device
    in: carried
    note: the SIM in the phone. It has no PIN, so it works in any phone.
    todo: set a SIM PIN
  hw_key: {kind: device, in: carried, note: FIDO2 key on the keyring; the only one}
  id_card: {kind: device, in: carried}
  nas: {kind: device, in: home}
  pi: {kind: device, in: home, note: small always-on server that runs the cloud sync}
  old_drive:
    kind: device
    in: unknown
    note: an old backup disk with the tax archive on it
    todo: find it; either in the attic or at my parents'

  laptop_open: {kind: state, note: the laptop unlocked}
  pm_open_laptop: {kind: state, in: laptop, note: password manager unlocked on the laptop}
  pm_open_phone: {kind: state, in: phone, note: password manager unlocked on the phone}
  mail_session_phone: {kind: state, in: phone, note: mail app signed in on the phone}

  laptop_pw: {kind: secret, in: head}
  phone_pin: {kind: secret, in: head}
  finger: {kind: secret, in: body}
  face: {kind: secret, in: body}
  key_pin: {kind: secret, in: head, note: FIDO2 PIN}
  safe_combo: {kind: secret, in: [head, partner]}
  pm_master:
    kind: secret
    access: pm_master_mem or pm_master_sheet
    note: the password manager's master password
  pm_master_mem: {kind: secret, in: head}
  pm_master_sheet: {kind: secret, in: safe, note: the emergency sheet}
  mail_pw: {kind: secret, in: vault}
  mail_totp: {kind: secret, in: authenticator}
  mail_codes: {kind: secret, in: safe, note: printed recovery codes}
  code_pw: {kind: secret, in: vault}
  code_totp: {kind: secret, in: authenticator}
  bank_pw: {kind: secret, in: vault}
  storage_pw: {kind: secret, in: vault}
  carrier_pw: {kind: secret, in: vault}
  registrar_pw: {kind: secret, in: vault}

  vault:
    kind: service
    note: the password manager, decrypted
    check: breach
    access: ((laptop or phone) and pm_master) or pm_open_laptop or pm_open_phone or (pm_master and hw_key)
  phone_number: {kind: service, note: SMS to my number, access: sim or carrier}
  domain: {kind: service, note: the custom domain my mail address is on, in: registrar}
  sync_job:
    kind: service
    note: one-way sync from the NAS to cloud storage; deletions sync too
    in: pi

  authenticator: {kind: data, in: phone, note: "the authenticator app's codes, with no backup"}
  documents: {kind: data, in: [docs_nas, docs_cloud], check: [lockout, breach]}
  docs_nas: {kind: data, in: nas}
  docs_cloud: {kind: data, in: storage, mirrors: {of: docs_nas, by: sync_job}}
  tax_archive: {kind: data, in: old_drive, check: [lockout, breach]}

  mail:
    kind: account
    check: [lockout, breach]
    needs: domain
    access: (mail_pw and (mail_totp or hw_key)) or mail_session_phone
    recovery: mail_codes or phone_number
  code_host:
    kind: account
    check: [lockout, breach]
    access: code_pw and (code_totp or (hw_key and key_pin))
    recovery: unknown
    todo: what does support ask for once the 2FA is gone?
  bank:
    kind: account
    check: [lockout, breach]
    access: bank_pw and phone_number
    recovery: id_card and body
    note: recovery is in person at a branch, with photo ID
  storage:
    kind: account
    note: cloud storage
    access: storage_pw and hw_key
    recovery: mail and unknown
    todo: does a reset by email get past the key?
  carrier: {kind: account, access: carrier_pw, recovery: mail or (id_card and body)}
  registrar: {kind: account, access: registrar_pw and hw_key, recovery: mail}

scenarios:
  lose_carried: {kind: lockout, gone: carried}
  house_fire: {kind: lockout, gone: [home, carried], note: "at night, everything is home"}
  nas_dies: {kind: lockout, gone: nas, note: "the pi keeps syncing, so the cloud copy empties too"}
  domain_lapses: {kind: lockout, gone: domain}
  forgot_master: {kind: lockout, gone: pm_master_mem, note: the sheet in the safe is still there}
  partner_alone:
    kind: lockout
    has: [home, partner]
    note: if I die or can't act, what my partner can get to
  thief_carried: {kind: breach, has: carried, note: phone and keys taken while locked}
  laptop_taken_open:
    kind: breach
    has: laptop
    assume: [laptop_open, pm_open_laptop]
    note: laptop taken open, password manager unlocked
  burglary: {kind: breach, has: home}
  sim_swap: {kind: breach, has: phone_number}

me: [head, body, carried, home]

plans:
  spare_key:
    note: a second FIDO2 key kept off-site, and no more mail resets by SMS
    things:
      offsite: {kind: location, note: a friend's house across town}
      key_keyring: {kind: device, in: carried}
      key_offsite: {kind: device, in: offsite}
      hw_key:
        in: []
        access: key_keyring or key_offsite
        note: any one of my keys; every account enrolls both
      mail: {recovery: mail_codes}
    scenarios:
      keys_lost: {kind: lockout, gone: key_keyring, note: keyring gone}
    me: [head, body, carried, home, offsite]

  backup:
    note: make the cloud copy a versioned backup instead of a sync, and retire the old drive
    things:
      old_drive: null
      sync_job: {note: nightly versioned backup; a deletion on the NAS keeps old versions}
      docs_cloud: {mirrors: null}
      tax_archive: {in: [docs_nas, docs_cloud]}
