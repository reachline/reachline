---
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  # - component: gitlab.reednel.com/shared/ci/renovate@1.3.0
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/codeql@$CI_COMMIT_SHA
    inputs:
      language: javascript-typescript
